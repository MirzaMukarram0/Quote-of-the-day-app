apiVersion: apps/v1
kind: Deployment
metadata:
  name: quote-deployment
  labels:
    app: quote
spec:
  replicas: 3
  selector:
    matchLabels:
      app: quote
  template:
    metadata:
      labels:
        app: quote
    spec:
      containers:
        - name: quote-service
          image: quote-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5001
          env:
            - name: PORT
              value: "5001"
            - name: MONGODB_URI
              value: "mongodb://mongo-service:27017/quoteapp"
            - name: JWT_SECRET
              value: "supersecretkey"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: quote-service
  labels:
    app: quote
spec:
  selector:
    app: quote
  ports:
    - port: 5001
      targetPort: 5001
      protocol: TCP
  type: ClusterIP